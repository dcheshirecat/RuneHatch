name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Pure React Native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project structure
        run: |
          mkdir -p android/app/src/main/java/com/runehatch
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/assets
          mkdir -p android/gradle/wrapper
          mkdir -p src/screens src/data

          cp build.gradle android/build.gradle
          cp settings.gradle android/settings.gradle
          cp gradle.properties android/gradle.properties
          cp app-build.gradle android/app/build.gradle
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp MainActivity.kt android/app/src/main/java/com/runehatch/MainActivity.kt
          cp MainApplication.kt android/app/src/main/java/com/runehatch/MainApplication.kt
          cp strings.xml android/app/src/main/res/values/strings.xml
          cp styles.xml android/app/src/main/res/values/styles.xml
          cp App.tsx src/App.tsx 2>/dev/null || true
          cp MenuScreen.tsx src/screens/MenuScreen.tsx 2>/dev/null || true
          cp MapScreen.tsx src/screens/MapScreen.tsx 2>/dev/null || true
          cp gameData.ts src/data/gameData.ts 2>/dev/null || true

      - name: Generate app icon
        run: |
          sudo apt-get install -y imagemagick
          # Create a purple rune egg icon
          convert -size 1024x1024 \
            radial-gradient:'#9b5de5-#1a0a2e' \
            -fill '#f0d97a' -pointsize 600 -gravity center \
            -annotate 0 '🥚' \
            /tmp/icon.png 2>/dev/null || \
          convert -size 1024x1024 xc:'#1a0a2e' \
            -fill '#9b5de5' -draw 'circle 512,512 512,200' \
            -fill '#f0d97a' -pointsize 400 -gravity center \
            -font DejaVu-Sans -annotate 0 'R' \
            /tmp/icon.png

          # Resize to each density
          convert /tmp/icon.png -resize 48x48   android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/icon.png -resize 72x72   android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert /tmp/icon.png -resize 96x96   android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/icon.png -resize 144x144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/icon.png -resize 192x192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          # Round icons
          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png    android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png    android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png   android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png  android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Generate Gradle wrapper
        run: |
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > android/gradle/wrapper/gradle-wrapper.properties
          curl -sL -o android/gradlew https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew
          curl -sL -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      - name: Generate debug keystore
        run: keytool -genkeypair -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Bundle JS into APK
        run: |
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-rn073-v3
          restore-keys: gradle-rn073-

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers 2
        env:
          JAVA_TOOL_OPTIONS: "-Xmx4g"

      - name: Verify APK exists
        run: find android/app/build/outputs -name "*.apk" || echo "No APK found"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: runehatch-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
